spring:
  datasource:
    # Overridable for docker-compose (DB_URL points at the postgres service).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modular_monolith}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}

  jpa:
    properties:
      hibernate:
        # Pretty-print SQL in local logs (no-op unless org.hibernate.SQL is at DEBUG).
        format_sql: true


app:
  security:
    jwt:
      # Local development mode: JWTs are signed and validated with a shared HMAC secret
      # (see docs/security.md "Local development"). Production NEVER sets this property -
      # it uses app.security.jwt.private-key/public-key (RSA).
      secret-key: ${JWT_LOCAL_SECRET:local-dev-secret-change-me-0123456789abcdef}
      issuer: modular-monolith
      audience: modular-monolith
      access-token-ttl: 15m
      refresh-token-ttl: 7d

  bootstrap:
    # Optional: provision the first ADMIN user on a fresh deployment.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin}

logging:
  # Console pattern comes from the base application.yml (standard pattern).
  level:
    com.example.app: DEBUG
    # DB query logging — local DEBUG mode only (never enabled in test/prod):
    # statements at DEBUG, bind parameter values at TRACE (see docs/observability.md).
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
