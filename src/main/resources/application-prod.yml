spring:
  datasource:
    # Production values MUST come from the environment - never hardcode them.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  security:
    oauth2:
      resourceserver:
        jwt:
          # OIDC discovery against the external Identity Provider (Keycloak,
          # Auth0, Cognito, Okta, ...). Fails fast at startup if not provided.
          issuer-uri: ${JWT_ISSUER_URI}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
