spring:
  datasource:
    # Production values MUST come from the environment - never hardcode them.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  security:
    jwt:
      # The application is its own token issuer in production: it signs access tokens
      # with an RSA private key and validates them with the matching public key.
      # Generate a key pair and provide both PEM values (see docs/security.md).
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      issuer: ${JWT_ISSUER:modular-monolith}
      audience: ${JWT_AUDIENCE:modular-monolith}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}

  bootstrap:
    # Optional: provision the first ADMIN user on a fresh deployment.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  # API docs (Swagger UI) are dev/test tooling — never expose them in production.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # Production sampling rate (overridable). 0.1 = 10% of requests traced.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          # REQUIRED in production - never fall back to a localhost collector.
          # Use HTTPS and, if the collector requires auth, set the headers map from
          # environment variables (e.g. OTLP_HEADERS). If unset, spans are created but
          # not exported (fail-open) - see docs/observability.md.
          endpoint: ${OTLP_ENDPOINT}
