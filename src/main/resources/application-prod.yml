spring:
  datasource:
    # Production values MUST come from the environment - never hardcode them.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  data:
    redis:
      # Redis must be on a protected network segment (never exposed to the public
      # internet); TLS is available via REDIS_SSL_ENABLED (see docs/security.md §8).
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

app:
  security:
    jwt:
      # The application is its own token issuer in production: it signs access tokens
      # with an RSA private key and validates them with the matching public key.
      # Generate a key pair and provide both PEM values (see docs/security.md).
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}
      issuer: ${JWT_ISSUER:modular-monolith}
      audience: ${JWT_AUDIENCE:modular-monolith}
      access-token-ttl: ${JWT_ACCESS_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
      # The Prometheus scraper token is minted offline with this same private key
      # (scripts/mint-rsa-jwt.py --role NONE --scope prometheus). The private key
      # never reaches Prometheus - only the minted bearer token is deployed as a
      # secret (see docs/observability.md "Prometheus access").

    # Redis-backed limiting fails OPEN by default (availability > strict limiting):
    # a Redis outage logs + counts (app.security.limiter.failopen meter) and allows
    # requests. Set LIMITER_REDIS_FAIL_OPEN=false to fail closed (500) instead.
    # Alert on the failopen meter - a silent rate-limit loss is the trade-off of
    # fail-open (see docs/security.md §8).
    limiter:
      redis-fail-open: ${LIMITER_REDIS_FAIL_OPEN:true}

  bootstrap:
    # Optional: provision the first ADMIN user on a fresh deployment.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc:
  # API docs (Swagger UI) are dev/test tooling — never expose them in production.
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # Production sampling rate (overridable). 0.1 = 10% of requests traced.
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          # REQUIRED in production - fail-fast: startup refuses to continue unless
          # OTLP_ENDPOINT is set (or the standard OTEL_EXPORTER_OTLP_ENDPOINT
          # environment variable, which Spring Boot maps to this property and which
          # takes precedence). Telemetry must be deliberately configured - never
          # silently dropped (see docs/observability.md "Tracing").
          # Collector auth: set OTEL_EXPORTER_OTLP_HEADERS (or the signal-specific
          # OTEL_EXPORTER_OTLP_TRACES_HEADERS) in OTel format, e.g.
          #   OTEL_EXPORTER_OTLP_HEADERS="Authorization=Bearer%20<token>"
          # Spring Boot 4.1 maps it to this exporter's headers at startup. Use HTTPS.
          endpoint: ${OTLP_ENDPOINT}
