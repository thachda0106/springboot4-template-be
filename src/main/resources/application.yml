spring:
  application:
    name: modular-monolith

  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only validates it.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  datasource:
    hikari:
      # Explicit HikariCP connection pool settings (all overridable per deployment).
      # pool-name also becomes the `pool` tag in the hikaricp_* metrics (see docs/observability.md).
      pool-name: modular-monolith-pool
      # Max connections the pool grows to. Rule of thumb: cores*2+disks; too many
      # waste Postgres memory, too few surface as acquisition timeouts under load.
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      # Idle connections kept warm (keep < maximum-pool-size so idle-timeout applies).
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Drop idle connections after 10 minutes.
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:600000}
      # Max wait for a connection from the pool before failing the request (30s).
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      # Max lifetime of a connection - always below the server's connection limit (30 min).
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
      # Max time to validate a connection on checkout - must stay < connection-timeout.
      validation-timeout: 5000
      # Log a warning (no failure) if a connection is checked out longer than 60s -
      # catches transactions leaking connections (e.g. a use case holding one too long).
      leak-detection-threshold: ${DB_POOL_LEAK_DETECTION_MS:60000}

  jackson:
    default-property-inclusion: non_null

# API documentation (OpenAPI spec + Swagger UI). Paths are explicit here;
# prod disables the endpoints entirely (see application-prod.yml).
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          # Readiness must track the dependency the instance actually needs: without
          # the DB the instance must not receive traffic (503 on the probe), even
          # though the process is up.
          include: readinessState,db
          # Probe groups hide components by default; expose them so operators can
          # tell whether the DB or the application state is the reason for 503.
          show-components: always
  tracing:
    # Sample every request locally/test; prod overrides (see application-prod.yml).
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP collector endpoint. Local/test default to localhost (no collector ->
          # export warnings, but trace IDs still populate the MDC for log correlation).
          # Prod REQUIRES OTLP_ENDPOINT (no default) - see application-prod.yml.
          endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  info:
    git:
      enabled: true
    build:
      enabled: true
    java:
      enabled: true
    # env is intentionally NOT enabled: /actuator/info is public and must not expose
    # environment details (see docs/observability.md).

jdbc:
  # JDBC query spans (datasource-micrometer, OTel semantic conventions v1.39):
  # every query executed through the (proxied) DataSource becomes a span nested under
  # the request span, with db.system.name/db.operation.name and a SANITIZED
  # db.query.text (literals scrubbed; bind parameter values are never captured -
  # SQL predicates carry user data, see docs/observability.md "SQL spans").
  includes: QUERY # OTel covers query execution only; skip CONNECTION/FETCH/KEYS noise
  opentelemetry:
    spans:
      enabled: true
    metrics:
      enabled: false # DB metrics already covered by the HikariCP meters
    analysis:
      sanitize:
        enabled: true

logging:
  # Standard console pattern (human-readable default for every profile). ISO-8601
  # timestamp, level, thread, trace/span ids (W3C trace context from the MDC) and
  # logger. test/prod override this entirely with ECS structured logging
  # (logging.structured.format.console: ecs) - structured output takes precedence
  # over the pattern properties.
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{40} - %msg%n"
  level:
    com.example.app: INFO

---
# Datasource and JWT issuer are environment-specific:
#   local -> application-local.yml (dev defaults, HMAC JWT mode)
#   test  -> application-test.yml  (Testcontainers + HMAC JWT mode)
#   prod  -> application-prod.yml  (env-provided DB_URL/DB_USERNAME/DB_PASSWORD + JWT_ISSUER_URI)
