app:
  security:
    jwt:
      # Fixed test secret: integration tests mint real HS256 JWTs with this
      # value and the application validates them with the same value.
      secret-key: test-jwt-secret-do-not-use-in-prod
      issuer: modular-monolith
      audience: modular-monolith
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    # Per-IP limiting is disabled in integration tests: both layers are simply
    # absent from the filter chain, so test traffic is never limited.
    throttle:
      enabled: false
    rate-limit:
      enabled: false

  bootstrap:
    # Optional: provision the first ADMIN user on a fresh deployment.
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:admin}

spring:
  flyway:
    enabled: true

# Deterministic observability assertions: ECS JSON logs (trace.id field) and 100% sampling.
logging:
  structured:
    format:
      console: ecs

management:
  tracing:
    sampling:
      probability: 1.0
