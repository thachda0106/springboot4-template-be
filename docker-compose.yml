services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modular_monolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modular_monolith"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      # Development stack: local profile = HMAC JWT mode (security still enforced,
      # tokens signed + validated, see docs/security.md). Production profile would need
      # DB_URL/DB_USERNAME/DB_PASSWORD + JWT_PRIVATE_KEY/JWT_PUBLIC_KEY (RSA).
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/modular_monolith
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_LOCAL_SECRET: local-dev-secret-change-me-0123456789abcdef
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.66.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:4318:4318"   # OTLP HTTP ingest (loopback only; matches app default endpoint)
      - "127.0.0.1:16686:16686" # Jaeger UI (loopback only)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"   # Prometheus UI (loopback only)
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Scraper bearer token: created by scripts/observability-up.sh (gitignored).
      - ./.observability/scraper-token:/etc/prometheus/scraper-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; no-op on Docker Desktop

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI (loopback only)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # loopback-bound => localhost-only viewer
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
