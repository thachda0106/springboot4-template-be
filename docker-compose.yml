services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modular_monolith
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d modular_monolith"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Distributed rate limiting + read cache (fail-open on outage, see docs/security.md §8).
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      # Development stack: local profile = HMAC JWT mode (security still enforced,
      # tokens signed + validated, see docs/security.md). Production profile would need
      # DB_URL/DB_USERNAME/DB_PASSWORD + JWT_PRIVATE_KEY/JWT_PUBLIC_KEY (RSA).
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/modular_monolith
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_LOCAL_SECRET: local-dev-secret-change-me-0123456789abcdef
      REDIS_HOST: redis
      TZ: UTC
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  jaeger:
    # Jaeger v2 (the v1 all-in-one image is end-of-life since 2025-12-31). The
    # all-in-one role needs no config file: transient in-memory storage, OTLP gRPC
    # ingest on :4317 (collector target), UI on :16686.
    image: jaegertracing/jaeger:2.20.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI (loopback only)
    healthcheck:
      # healthcheckv2 /status on the internal admin port (not published); 200 = healthy.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/status"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:4318:4318"   # OTLP HTTP ingest (loopback only; takes over Jaeger's old host port)
      - "127.0.0.1:13133:13133" # health_check extension (loopback only; readiness probe)
    volumes:
      - ./observability/otelcol-config.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    # No in-container healthcheck possible: the image ships no shell/wget (distroless).
    # A dead collector is caught by the otel-collector target-down Grafana alert and
    # the observability smoke test; restart: unless-stopped recovers it automatically.
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"   # Prometheus UI (loopback only)
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Scraper bearer token: created by scripts/observability-up.sh (gitignored).
      - ./.observability/scraper-token:/etc/prometheus/scraper-token:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # Linux; no-op on Docker Desktop
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"   # Grafana UI (loopback only)
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # loopback-bound => localhost-only viewer
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

volumes:
  postgres-data:
