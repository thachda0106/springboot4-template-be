global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: modular-monolith
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scraper-token
    static_configs:
      - targets: ["host.docker.internal:8080"]
  # Collector self-metrics: exporter failures/dropped spans are visible here
  # (otelcol_exporter_send_failed_spans), internal to the compose network only.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
